<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>My Personal Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #003366;
            border-bottom: 2px solid #003366;
            padding-bottom: 10px;
        }
        .info {
            margin: 15px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        .label {
            font-weight: bold;
            color: #555;
        }
        .value {
            color: #003366;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>My Personal Information</h1>
        
        <div class="info">
            <span class="label">Full Name:</span>
            <span class="value">
                {{firstName}} {{ lastName }}
            </span>
        </div>
        
        <div class="info">
            <span class="label">Student ID:</span>
            <span class="value">{{ studentId }}</span>
        </div>
        
        <div class="info">
            <span class="label">Address:</span>
            <span class="value">{{ address|upper }}</span>
        </div>
        
        <div class="info">
            <span class="label">Email:</span>
            <span class="value">{{ email|default:"No email provided" }}</span>
        </div>
        
        <div class="info">
            <span class="label">Date of Birth:</span>
            <span class="value">{{birthDate}}</span>
        </div>
    </div>
</body>
</html>
